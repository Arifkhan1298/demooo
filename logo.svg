<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4" />
      <stop offset="40%" stop-color="#D6B36A" />
      <stop offset="80%" stop-color="#B38938" />
      <stop offset="100%" stop-color="#E5C77E" />
    </linearGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#060A12" />
    </linearGradient>
  </defs>

  <!-- Monogram Mark Group -->
  <g transform="translate(10, 10)">
    <!-- Rounded Background Crest -->
    <rect width="70" height="70" rx="16" fill="url(#logoBg)" stroke="url(#logoGold)" stroke-width="1.2" stroke-opacity="0.4" />
    
    <!-- Mini ZN Geometry inside Crest -->
    <g transform="translate(35, 35) scale(0.22)">
      <!-- Letter 'Z' Upper Bar -->
      <path d="M-110 -130 L90 -130 L110 -98 L-40 -98 Z" fill="url(#logoGold)" />
      <!-- Letter 'N' Left Pillar -->
      <path d="M-110 -90 L-76 -90 L-76 130 L-110 130 Z" fill="url(#logoGold)" />
      <!-- Z Diagonal Stem -->
      <path d="M85 -95 L-65 100 L-100 100 L50 -95 Z" fill="url(#logoGold)" />
      <!-- N Diagonal Stem -->
      <path d="M-72 -50 L75 110 L108 110 L-38 -50 Z" fill="url(#logoGold)" fill-opacity="0.9" />
      <!-- Letter 'N' Right Pillar -->
      <path d="M76 -130 L110 -130 L110 90 L76 90 Z" fill="url(#logoGold)" />
      <!-- Letter 'Z' Lower Bar -->
      <path d="M-90 98 L110 98 L90 130 L-110 130 Z" fill="url(#logoGold)" />
      <!-- Central Diamond Accent -->
      <polygon points="0,-16 16,0 0,16 -16,0" fill="#FFF8E7" />
    </g>
  </g>

  <!-- Wordmark Section -->
  <g transform="translate(96, 22)">
    <!-- Primary Name -->
    <text x="0" y="27" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="22" font-weight="700" letter-spacing="3.5" fill="currentColor">
      ZAINAB <tspan fill="url(#logoGold)">NASEER</tspan>
    </text>
    
    <!-- Subtitle / Brand Tagline -->
    <text x="1" y="44" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" letter-spacing="4" fill="url(#logoGold)" opacity="0.85">
      SIGNATURE DIGITAL UNIVERSE
    </text>
  </g>
</svg>
