<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B283E" />
      <stop offset="60%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#060A12" />
    </radialGradient>
    <linearGradient id="avGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4" />
      <stop offset="40%" stop-color="#D6B36A" />
      <stop offset="80%" stop-color="#B38938" />
      <stop offset="100%" stop-color="#E5C77E" />
    </linearGradient>
  </defs>
  
  <rect width="500" height="500" fill="url(#avatarGlow)" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#avGold)" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#avGold)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4 8" />
  <circle cx="250" cy="250" r="185" fill="#090E1A" stroke="url(#avGold)" stroke-width="1.5" stroke-opacity="0.6" />

  <g transform="translate(250, 220) scale(0.68)">
    <!-- Letter 'Z' Upper Bar -->
    <path d="M-110 -130 L90 -130 L110 -98 L-40 -98 Z" fill="url(#avGold)" />
    <!-- Letter 'N' Left Pillar -->
    <path d="M-110 -90 L-76 -90 L-76 130 L-110 130 Z" fill="url(#avGold)" />
    <!-- Z Diagonal Stem -->
    <path d="M85 -95 L-65 100 L-100 100 L50 -95 Z" fill="url(#avGold)" />
    <!-- N Diagonal Stem -->
    <path d="M-72 -50 L75 110 L108 110 L-38 -50 Z" fill="url(#avGold)" fill-opacity="0.9" />
    <!-- Letter 'N' Right Pillar -->
    <path d="M76 -130 L110 -130 L110 90 L76 90 Z" fill="url(#avGold)" />
    <!-- Letter 'Z' Lower Bar -->
    <path d="M-90 98 L110 98 L90 130 L-110 130 Z" fill="url(#avGold)" />
    <polygon points="0,-16 16,0 0,16 -16,0" fill="#FFF8E7" />
  </g>

  <!-- Name Arc / Bottom Title -->
  <text x="250" y="375" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="20" font-weight="700" letter-spacing="4" fill="#FAFAF8">
    ZAINAB NASEER
  </text>
  <text x="250" y="402" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#D6B36A">
    BSIT • WEB DEVELOPER
  </text>
</svg>
