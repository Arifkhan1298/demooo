<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4" />
      <stop offset="35%" stop-color="#D6B36A" />
      <stop offset="70%" stop-color="#B38938" />
      <stop offset="100%" stop-color="#E5C77E" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B38938" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F7E7B4" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#060A12" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Geometric Shield / Frame -->
  <rect width="512" height="512" rx="104" fill="url(#darkBg)" />
  
  <!-- Outer Decorative Precision Diamond & Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.35" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 8" />
  
  <!-- Corner Accent Marks -->
  <path d="M54 74 L74 54 M458 74 L438 54 M54 438 L74 458 M458 438 L438 458" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- ZN Interlocking Monogram Geometry -->
  <g transform="translate(256, 256)" id="monogram-core">
    <!-- Ambient Backdrop Ring -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="url(#goldGlow)" stroke-width="1" />
    
    <!-- Letter 'Z' Upper Bar with Chamfered Precision -->
    <path d="M-110 -130 L90 -130 L110 -98 L-40 -98 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" />
    
    <!-- Letter 'N' Left Pillar -->
    <path d="M-110 -90 L-76 -90 L-76 130 L-110 130 Z" fill="url(#goldGrad)" />
    
    <!-- Shared / Interlocking Dynamic Diagonal (Connecting Z & N) -->
    <!-- Z Diagonal Stem -->
    <path d="M85 -95 L-65 100 L-100 100 L50 -95 Z" fill="url(#goldGrad)" />
    
    <!-- Letter 'N' Dynamic Diagonal Accent with Negative Space Gap -->
    <path d="M-72 -50 L75 110 L108 110 L-38 -50 Z" fill="url(#goldGrad)" fill-opacity="0.9" />
    
    <!-- Letter 'N' Right Pillar -->
    <path d="M76 -130 L110 -130 L110 90 L76 90 Z" fill="url(#goldGrad)" />
    
    <!-- Letter 'Z' Lower Bar with Chamfered Precision -->
    <path d="M-90 98 L110 98 L90 130 L-110 130 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" />
    
    <!-- Central Luxury Node / Emblem Diamond -->
    <polygon points="0,-16 16,0 0,16 -16,0" fill="#FFF8E7" />
  </g>
</svg>
