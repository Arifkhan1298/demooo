  </defs>
  <rect width="64" height="64" rx="14" fill="url(#favBg)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#favGold)" stroke-width="1.2" stroke-opacity="0.5" />
  <g transform="translate(32, 32) scale(0.19)">
